[package]
name = "binbook-fw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "BinBook firmware for Xteink X4"

[dependencies]
binbook-core.workspace = true
xteink-x4-display.workspace = true
ssd1677-driver.workspace = true
embedded-hal.workspace = true
embedded-hal-async.workspace = true
embedded-storage.workspace = true
binbook-diagnostic-protocol = { workspace = true, optional = true }
binbook-storage = { workspace = true, default-features = false }
embedded-sd-storage = { workspace = true, optional = true }
embedded-sdmmc = { workspace = true, optional = true }
embassy-sync.workspace = true
embedded-graphics.workspace = true
heapless.workspace = true
profont.workspace = true
nb.workspace = true
portable-atomic.workspace = true

[dev-dependencies]
binbook-decompress.workspace = true

[target.'cfg(target_arch = "riscv32")'.dependencies]
embassy-executor = { workspace = true, optional = true }
embassy-futures = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }
embedded-hal-bus = { workspace = true, optional = true }
esp-backtrace = { workspace = true, features = ["esp32c3", "panic-handler", "println"], optional = true }
esp-bootloader-esp-idf = { workspace = true, features = ["esp32c3"], optional = true }
esp-hal = { workspace = true, features = ["esp32c3", "unstable"], optional = true }
esp-println = { workspace = true, features = ["esp32c3", "jtag-serial"], optional = true }
esp-rtos = { workspace = true, features = ["esp32c3", "embassy"], optional = true }
esp-storage = { workspace = true, features = ["esp32c3"], optional = true }
static_cell = { workspace = true, optional = true }

[features]
firmware-bin = [
    "dep:esp-backtrace",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:embassy-executor",
    "dep:embassy-time",
    "dep:embassy-futures",
    "dep:esp-rtos",
    "dep:esp-println",
    "dep:static_cell",
]
sd-storage = [
    "dep:embedded-hal-bus",
    "dep:embedded-sdmmc",
    "dep:embedded-sd-storage",
    "mounted-storage-owner",
]
debug-log = []
storage-owner-probe = []
# Compatibility alias for scripts created while the mounted owner was gated.
# `sd-storage` now selects this path unconditionally.
mounted-storage-owner = []
chunk-dirty-probe = []
fast-refresh-mode = []
preview-lut-turns = ["fast-refresh-mode"]
diagnostic-console = [
    "dep:binbook-diagnostic-protocol",
    "dep:esp-storage",
]

[[bin]]
name = "binbook-fw"
path = "src/main.rs"
test = false
doctest = false
bench = false
required-features = ["firmware-bin"]

[lints]
workspace = true
